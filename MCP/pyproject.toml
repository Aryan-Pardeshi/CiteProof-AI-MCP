[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeproof-mcp"
version = "0.2.0"
description = "Audit tools for AI literature reviews: PRISMA records, screening agreement, DOI and quote checks, risk of bias. An MCP server for Claude Science and other MCP clients."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aryan Pardeshi" }]
keywords = ["mcp", "systematic-review", "prisma", "citations", "research", "claude-science"]
dependencies = [
    "mcp>=1.27",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.0"]

[project.urls]
Homepage = "https://github.com/Aryan-Pardeshi/CiteProof-AI-MCP"

[project.scripts]
citeproof-mcp = "citeproof_mcp.__main__:main"

[tool.setuptools]
license-files = ["LICENSES/*", "NOTICE.md"]

[tool.setuptools.packages.find]
include = ["citeproof_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
