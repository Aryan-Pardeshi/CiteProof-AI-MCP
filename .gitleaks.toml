# Gitleaks configuration: the default rules plus allowlists for known non-secrets.
# Every entry was checked by hand; do not add a path or value without checking it.
[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures use fake keys, tokens and idempotency keys"
paths = ['''^tests/''']

[[allowlists]]
description = "Placeholder values and storage key names, not secrets"
regexes = [
  '''^sk_test_placeholder$''',
  '''^citeproof_gh_stars_v1$''',
]
