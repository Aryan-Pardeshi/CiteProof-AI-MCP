name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install ruff==0.17.1
      - run: ruff check .
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q --ignore=MCP
        env:
          LLM_API_KEY: test-key
  mcp:
    name: mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: MCP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MCP/pyproject.toml
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
  mcp-claude-science:
    # Claude Science bundles Python 3.13 with mcp 1.x (SPEC acceptance 1).
    name: mcp (python 3.13, mcp 1.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MCP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: MCP/pyproject.toml
      - run: pip install -e ".[test]" "mcp>=1.27,<2"
      - run: python -m pytest -q
